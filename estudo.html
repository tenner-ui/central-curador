<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia Clínico de Hormônios · Prática Médica & Fisiculturismo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.4.0/3Dmol-min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#05070e; --bg1:#0a1224; --bg2:#0e1b33;
  --teal:#2ee6c8; --teal-d:#12b5a0;
  --blue:#4d8bff; --violet:#9b6bff; --pink:#ff6fae;
  --gold:#ffcf6b; --red:#ff6b6b; --green:#4be3a0;
  --ink:#eaf2ff; --ink-dim:#9fb2d4; --ink-faint:#6a7ea6;
  --glass:rgba(18,30,56,.55); --glass-2:rgba(24,40,74,.5);
  --stroke:rgba(120,160,255,.16); --stroke-2:rgba(120,160,255,.28);
  --shadow:0 20px 60px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  color:var(--ink);
  background:var(--bg0);
  overflow:hidden;
}
/* ===== animated background ===== */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(1200px 800px at 80% -10%,rgba(155,107,255,.18),transparent 60%),
  radial-gradient(1000px 700px at 10% 110%,rgba(46,230,200,.16),transparent 55%),
  radial-gradient(900px 900px at 50% 50%,rgba(77,139,255,.10),transparent 60%),
  linear-gradient(160deg,var(--bg0),var(--bg1) 45%,var(--bg2));
}
.bg .grid{position:absolute;inset:0;background-image:
  linear-gradient(rgba(120,160,255,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(120,160,255,.05) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(circle at 50% 40%,#000,transparent 85%)}
.float{position:absolute;opacity:.5;filter:drop-shadow(0 8px 30px rgba(46,230,200,.25));animation:drift 22s ease-in-out infinite}
.float.f2{animation-duration:28s;animation-delay:-6s;opacity:.4}
.float.f3{animation-duration:34s;animation-delay:-12s;opacity:.35}
.float.f4{animation-duration:26s;animation-delay:-3s;opacity:.3}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-38px) rotate(12deg)}}
/* ===== layout ===== */
.app{position:relative;z-index:2;display:grid;grid-template-columns:340px 1fr;height:100vh}
/* sidebar */
.side{backdrop-filter:blur(18px);background:linear-gradient(180deg,rgba(14,27,51,.85),rgba(8,14,28,.9));
  border-right:1px solid var(--stroke);display:flex;flex-direction:column;height:100vh}
.brand{padding:20px 22px 14px;border-bottom:1px solid var(--stroke)}
.brand h1{font-family:'Space Grotesk';font-size:18px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 200deg,var(--teal),var(--blue),var(--violet),var(--teal));
  display:grid;place-items:center;box-shadow:0 6px 20px -6px var(--teal-d)}
.brand .logo svg{width:20px;height:20px}
.brand p{margin-top:6px;font-size:11.5px;color:var(--ink-faint);letter-spacing:.3px}
.search{padding:12px 16px}
.search input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--stroke);
  background:rgba(6,12,26,.7);color:var(--ink);font-size:13px;outline:none;transition:.2s}
.search input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,230,200,.12)}
.navtabs{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.navtab{flex:1 1 auto;min-width:64px;padding:9px 6px;text-align:center;font-size:11.5px;font-weight:600;border-radius:9px;cursor:pointer;
  color:var(--ink-dim);border:1px solid transparent;transition:.2s;background:rgba(255,255,255,.02)}
.navtab.active{color:#05121a;background:linear-gradient(120deg,var(--teal),var(--blue));border-color:transparent;
  box-shadow:0 8px 22px -10px var(--teal-d)}
.list{flex:1;overflow-y:auto;padding:6px 10px 30px}
.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:rgba(120,160,255,.2);border-radius:8px}
.cat{margin:12px 6px 6px;font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-faint);
  display:flex;align-items:center;gap:8px}
.cat::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--catc,var(--teal));box-shadow:0 0 10px var(--catc,var(--teal))}
.hbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;margin:3px 0;border-radius:11px;
  border:1px solid transparent;background:transparent;color:var(--ink-dim);cursor:pointer;font-size:13.5px;font-weight:500;transition:.16s;position:relative}
.hbtn:hover{background:rgba(120,160,255,.08);color:var(--ink);transform:translateX(2px)}
.hbtn.active{background:linear-gradient(100deg,rgba(46,230,200,.16),rgba(77,139,255,.10));color:#fff;
  border-color:var(--stroke-2);box-shadow:inset 0 0 0 1px rgba(46,230,200,.15)}
.hbtn .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--teal));box-shadow:0 0 10px var(--c,var(--teal))}
.hbtn .tag{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:20px;
  background:rgba(255,255,255,.06);color:var(--ink-faint)}
/* main */
.main{overflow-y:auto;height:100vh;padding:26px 34px 60px;scroll-behavior:smooth}
.main::-webkit-scrollbar{width:10px}.main::-webkit-scrollbar-thumb{background:rgba(120,160,255,.18);border-radius:8px}
.disc{background:linear-gradient(100deg,rgba(255,107,107,.10),rgba(255,207,107,.06));border:1px solid rgba(255,107,107,.25);
  border-radius:14px;padding:12px 16px;font-size:12px;color:#ffd9c9;margin-bottom:20px;display:flex;gap:10px;align-items:flex-start}
.disc b{color:#ffb59b}
/* hero card */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;margin-bottom:22px}
@media(max-width:1050px){.hero{grid-template-columns:1fr}}
.card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--stroke);border-radius:20px;box-shadow:var(--shadow)}
.hleft{padding:26px 28px;position:relative;overflow:hidden}
.hleft::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,var(--accent,#2ee6c8),transparent 68%);opacity:.14;filter:blur(6px)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  padding:5px 12px;border-radius:30px;background:rgba(46,230,200,.12);color:var(--teal);border:1px solid rgba(46,230,200,.25)}
.hleft h2{font-family:'Space Grotesk';font-size:34px;font-weight:700;margin:14px 0 4px;line-height:1.05}
.hleft .sub{color:var(--ink-dim);font-size:14px;font-weight:500}
.hleft .chem{margin-top:8px;font-family:'Space Grotesk';font-size:12.5px;color:var(--ink-faint);letter-spacing:.5px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.badge{font-size:11px;padding:6px 11px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);color:var(--ink-dim)}
.badge b{color:var(--ink);font-weight:600}
/* 3d viewer */
.hright{position:relative;min-height:320px;border-radius:20px;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,rgba(46,230,200,.10),transparent 70%),rgba(6,12,26,.5)}
.viewer{position:absolute;inset:0}
.vlabel{position:absolute;left:14px;bottom:12px;z-index:5;font-size:11px;color:var(--ink-faint);
  background:rgba(6,12,26,.6);padding:5px 10px;border-radius:8px;border:1px solid var(--stroke);backdrop-filter:blur(6px)}
.vctrl{position:absolute;right:12px;top:12px;z-index:5;display:flex;gap:6px}
.vctrl button{width:32px;height:32px;border-radius:9px;border:1px solid var(--stroke);background:rgba(6,12,26,.6);color:var(--ink-dim);
  cursor:pointer;font-size:14px;backdrop-filter:blur(6px);transition:.15s}
.vctrl button:hover{color:#fff;border-color:var(--teal)}
.vspin{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-faint);font-size:12px;gap:12px;text-align:center;padding:20px}
.ring{width:44px;height:44px;border-radius:50%;border:3px solid rgba(120,160,255,.2);border-top-color:var(--teal);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* content grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.sec{padding:20px 22px}
.sec h3{font-family:'Space Grotesk';font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sec h3 .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:var(--icbg,rgba(46,230,200,.14));border:1px solid var(--stroke)}
.sec p,.sec li{font-size:13.5px;line-height:1.65;color:var(--ink-dim)}
.sec strong{color:var(--ink);font-weight:600}
.sec ul{list-style:none;margin-top:4px}
.sec ul li{position:relative;padding-left:18px;margin:7px 0}
.sec ul li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:2px;
  background:var(--bul,var(--teal));box-shadow:0 0 8px var(--bul,var(--teal))}
.kv{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--stroke);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-faint);min-width:120px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.kv .v{color:var(--ink);flex:1}
.full{grid-column:1/-1}
.warn{border-color:rgba(255,107,107,.3)!important;background:linear-gradient(100deg,rgba(255,107,107,.07),rgba(255,111,174,.04))}
.warn h3 .ic{background:rgba(255,107,107,.16)}
.tips{border-color:rgba(75,227,160,.28)!important;background:linear-gradient(100deg,rgba(75,227,160,.07),rgba(46,230,200,.04))}
.tips h3 .ic{background:rgba(75,227,160,.16)}
.fisi{border-color:rgba(255,207,107,.28)!important;background:linear-gradient(100deg,rgba(255,207,107,.08),rgba(255,111,174,.04))}
.fisi h3 .ic{background:rgba(255,207,107,.16)}
/* indications tab */
.indwrap{max-width:1200px}
.indhead{margin-bottom:22px}
.indhead h2{font-family:'Space Grotesk';font-size:30px;font-weight:700}
.indhead p{color:var(--ink-dim);margin-top:6px;font-size:14px;max-width:800px}
.indgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.indcard{padding:20px 22px}
.indcard h4{font-family:'Space Grotesk';font-size:15px;display:flex;align-items:center;gap:9px;margin-bottom:12px}
.indcard h4 .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--icbg,rgba(46,230,200,.14));border:1px solid var(--stroke)}
.indcard ul{list-style:none}
.indcard li{position:relative;padding-left:16px;margin:9px 0;font-size:13px;line-height:1.5;color:var(--ink-dim)}
.indcard li::before{content:"▸";position:absolute;left:0;color:var(--teal)}
.indcard li b{color:var(--ink);font-weight:600}
.about{max-width:820px}
.about h2{font-family:'Space Grotesk';font-size:26px;margin-bottom:14px}
.about p{color:var(--ink-dim);line-height:1.7;font-size:14px;margin-bottom:14px}
.subtabs{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.subtab{padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-dim);
  background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(10px);transition:.16s}
.subtab:hover{color:#fff;border-color:var(--stroke-2)}
.subtab.active{color:#05121a;background:linear-gradient(120deg,var(--teal),var(--blue));border-color:transparent;box-shadow:0 8px 22px -12px var(--teal-d)}
.pubstep{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--stroke)}
.pubstep:last-child{border-bottom:none}
.pubstep .n{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:linear-gradient(120deg,var(--teal),var(--blue));color:#05121a}
.pubstep .t{font-size:13.5px;line-height:1.6;color:var(--ink-dim)}
.pubstep .t b{color:var(--ink)}
.labitem{padding:12px 0;border-bottom:1px dashed var(--stroke)}
.labitem:last-child{border-bottom:none}
.labitem .en{font-weight:600;color:var(--ink);font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.labitem .en .u{font-size:10.5px;font-weight:600;color:var(--ink-faint);background:rgba(120,160,255,.10);padding:2px 7px;border-radius:20px}
.labitem .ed{font-size:12.7px;color:var(--ink-dim);line-height:1.55;margin-top:5px}
.labitem .em{font-size:12.3px;color:var(--ink);line-height:1.5;margin-top:6px}
.labitem .em b{color:#5ad1ff}
.labitem .ec{font-size:12.3px;color:#9fe3c4;line-height:1.5;margin-top:4px}
.labitem .ec b{color:#4be3a0}
.sched{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px}
.schcard{background:rgba(255,255,255,.03);border:1px solid var(--stroke);border-radius:12px;padding:12px 14px}
.schcard .st{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--teal)}
.schcard .sc{font-size:12.5px;color:var(--ink-dim);margin-top:5px;line-height:1.5}
.cbar-row{display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:center;margin:10px 0}
.cbar-name{font-size:12.5px;color:var(--ink);font-weight:500;text-align:right;line-height:1.2;cursor:pointer}
.cbar-name:hover{color:var(--teal)}
.cbar-track{position:relative;height:26px;background:rgba(255,255,255,.03);border-radius:8px;overflow:hidden}
.cbar-fill{height:100%;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;font-size:11.5px;font-weight:700;color:#05121a;min-width:38px}
.clegend{display:flex;gap:16px;flex-wrap:wrap;margin:2px 0 16px;font-size:11.5px;color:var(--ink-dim)}
.clegend span{display:flex;align-items:center;gap:6px}.clegend i{width:11px;height:11px;border-radius:3px}
.ctable{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.ctable th,.ctable td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--stroke)}
.ctable th{color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.ctable td{color:var(--ink-dim)}.ctable tbody tr{cursor:pointer}.ctable tbody tr:hover td{background:rgba(120,160,255,.06)}
.cphase{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px}
.calc label{font-size:11px;color:var(--ink-faint);display:block;margin-bottom:4px;font-weight:600}
.calc input,.calc select{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--stroke);background:rgba(6,12,26,.7);color:var(--ink);font-size:13px;outline:none}
.calc input:focus,.calc select:focus{border-color:var(--teal)}
.calcbtn{margin-top:12px;padding:10px 18px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:13px;background:linear-gradient(120deg,var(--teal),var(--blue));color:#05121a}
.calcout{margin-top:12px;padding:12px 14px;border-radius:10px;background:rgba(46,230,200,.08);border:1px solid rgba(46,230,200,.25);font-size:13.5px;color:var(--ink);min-height:20px}
.labref{font-size:12px;color:#7fb0ff;margin-top:6px}.labref b{color:#a9cbff}
.biogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:10px}
.biocard{background:rgba(255,255,255,.02);border:1px solid var(--stroke);border-radius:14px;padding:14px 16px;transition:.15s}
.biocard:hover{border-color:var(--stroke-2);background:rgba(120,160,255,.05);transform:translateY(-1px)}
.biocard .bh{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.biocard .bi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:rgba(120,160,255,.08);border:1px solid var(--stroke);flex:none}
.biocard .bn{font-weight:600;font-size:14px;color:var(--ink)}
.biocard .bl{font-size:12.6px;color:var(--ink-dim);line-height:1.5;margin-top:5px}
.navtab .ni{opacity:.85;margin-right:3px}
.cmp3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
@media(max-width:900px){.cmp3{grid-template-columns:1fr}}
.cmp3 .card.sec h3{font-size:14px}
.avgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px}
.avgrid label{display:block;font-size:11px;color:var(--ink-faint);margin-bottom:4px;font-weight:600}
.avgrid input,.avgrid select{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--stroke);background:rgba(6,12,26,.7);color:var(--ink);font-size:13px;outline:none}
.avgrid input:focus,.avgrid select:focus{border-color:var(--teal)}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:6px}
.chk{display:flex;align-items:center;gap:9px;font-size:12.7px;color:var(--ink-dim);cursor:pointer;padding:9px 11px;border:1px solid var(--stroke);border-radius:9px;background:rgba(255,255,255,.02);transition:.15s}
.chk:hover{border-color:var(--stroke-2);color:var(--ink)}
.chk input{width:16px;height:16px;accent-color:var(--teal);flex:none}
.verdict{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;padding:5px 13px;border-radius:20px;margin-bottom:10px}
.avcard h4{font-family:'Space Grotesk';font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:9px}
.avopt{display:inline-block;margin:4px 6px 0 0;padding:6px 12px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;
  background:rgba(46,230,200,.12);color:var(--teal);border:1px solid rgba(46,230,200,.28)}
.avopt:hover{background:rgba(46,230,200,.2)}
.hide{display:none!important}
.empty{display:grid;place-items:center;height:60vh;color:var(--ink-faint);text-align:center;gap:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--ink-faint)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;width:86%;max-width:340px;z-index:40;transform:translateX(-102%);transition:.3s}
  .side.open{transform:none}.mtoggle{display:grid!important}.hleft h2{font-size:26px}}
.mtoggle{display:none;position:fixed;left:14px;top:14px;z-index:50;width:44px;height:44px;border-radius:12px;place-items:center;
  background:var(--glass);border:1px solid var(--stroke-2);color:#fff;cursor:pointer;backdrop-filter:blur(10px)}
.tblscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:820px){
  .main{padding:20px 14px 70px;padding-top:64px}
  .hleft{padding:20px}.hleft h2{font-size:23px}
  .indhead h2,.about h2{font-size:22px}
  .hero{gap:14px}.hright{min-height:240px}
  .grid2{grid-template-columns:1fr}
  .cbar-row{grid-template-columns:92px 1fr;gap:8px}.cbar-name{font-size:10.5px}
  .ctable{font-size:11px;min-width:540px}.ctable th,.ctable td{padding:7px 7px}
  .sched{grid-template-columns:1fr 1fr}
  .subtab{padding:9px 12px;font-size:12px}
  .sec,.indcard,.avcard{padding:16px}
  h2{font-size:22px}
}
@media(max-width:480px){.sched{grid-template-columns:1fr}.chkgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

 desc:"Andrógeno oral muito potente em força e agressividade, com ganho de massa modesto. Não aromatiza. Um dos mais hepatotóxicos. Usado em janelas curtas (pré-competição de força/luta, ou dureza na reta final).",
 efeitos:["Aumento agudo de força e agressividade; dureza e vascularização.","Estímulo eritropoético; sem retenção."],
 colaterais:["Hepatotoxicidade severa; piora lipídica acentuada.","Agressividade excessiva; supressão do eixo."],
 manejo:["Uso muito curto e pontual; suporte hepático; monitorar lipídios e humor."],
 indicacoes:["Hipogonadismo, câncer de mama (paliativo), anemia (uso histórico)."],
 usos:"Pico de força/agressividade pontual; dureza pré-contest.",
 fisi:"Usado dias antes de competição de força/powerlifting ou na reta final de definição; janelas curtíssimas.",
 monit:"Enzimas hepáticas, lipídios, PA, humor."},

{id:"metiltesto",cat:"aas",nome:"Metiltestosterona",sub:"Oral · testosterona 17-metilada",chem:"C₂₀H₃₀O₂",pubchem:"methyltestosterone",
 classe:"EAA oral · 17α-alquilado · aromatizável (a metilestradiol)",
 pk:"Meia-vida ~2,5-4 h. Primeiro andrógeno oral eficaz; hoje pouco usado por toxicidade.",
 desc:"Testosterona metilada para resistir ao primeiro passo hepático. Historicamente importante, mas hepatotóxica e associada a peliose/tumores hepáticos com uso prolongado. Ainda presente em algumas formulações (ex.: com estrogênios em terapia feminina).",
 efeitos:["Efeito androgênico oral; libido e agressividade."],
 colaterais:["Hepatotoxicidade marcante (peliose hepática, adenomas).","Aromatização a metilestradiol (ginecomastia); lipídios piores."],
 manejo:["Evitar uso prolongado; alternativas mais seguras preferíveis."],
 indicacoes:["Hipogonadismo (histórico), terapia hormonal feminina combinada (baixa dose), câncer de mama (paliativo)."],
 usos:"Histórico/nichado; raramente recomendado hoje.",
 fisi:"Uso pré-treino anedótico por agressividade; desencorajado pela toxicidade.",
 monit:"Enzimas hepáticas, estradiol, lipídios."},

/* ---------------- GH / PEPTÍDEOS / INSULINA ---------------- */
{id:"gh",cat:"gh",nome:"Hormônio do Crescimento (GH / Somatropina)",sub:"Peptídeo de 191 aminoácidos",chem:"~22 kDa · polipeptídeo",pubchem:null,mol3d:"peptide",
 classe:"Hormônio peptídico (hipófise anterior) · somatropina recombinante (rhGH)",
 pk:"Meia-vida do GH exógeno ~2-4 h; efeitos mediados por IGF-1 hepático (meia-vida longa). Doses fracionadas.",
 desc:"Secretado pela hipófise de forma pulsátil, atua direto e via IGF-1. Promove crescimento linear na infância, lipólise, síntese proteica e reparo tecidual. Uso clínico bem estabelecido na deficiência de GH; uso off-label estético/anti-aging é controverso.",
 efeitos:["Lipólise (redução de gordura, sobretudo visceral).","Síntese de colágeno, reparo tecidual e de tendões.","Melhora de composição corporal, pele e recuperação; efeito anabólico indireto via IGF-1."],
 colaterais:["Retenção hídrica, síndrome do túnel do carpo, artralgia.","Resistência à insulina / hiperglicemia; risco de diabetes.","Acromegalia com doses altas crônicas (crescimento de mãos, mandíbula, vísceras).","Potencial crescimento de neoplasias pré-existentes."],
 manejo:["Titulação lenta; monitorar glicemia/HbA1c e IGF-1.","Reduzir dose se parestesias/edema; rastrear neoplasias."],
 indicacoes:["Deficiência de GH (criança e adulto), baixa estatura idiopática, Turner, Prader-Willi, IRC pediátrica, síndrome do intestino curto, caquexia por HIV."],
 usos:"Reposição na deficiência; reparo/recuperação; anti-aging (off-label).",
 fisi:"Usado por lipólise, recuperação e 'qualidade' tecidual; efeitos lentos (meses). Frequentemente combinado a insulina/tireoide (risco elevado).",
 monit:"IGF-1, glicemia/HbA1c, função tireoidiana, PA, rastreio oncológico."},

{id:"igf1",cat:"gh",nome:"IGF-1 LR3",sub:"Fator de crescimento semelhante à insulina (análogo)",chem:"Polipeptídeo (83 aa, análogo)",pubchem:null,mol3d:"peptide",
 classe:"Fator de crescimento peptídico · mediador da ação anabólica do GH",
 pk:"LR3 é análogo de meia-vida prolongada (~20-30 h) por baixa ligação às IGFBP.",
 desc:"Mediador primário dos efeitos anabólicos do GH. Estimula hiperplasia (proliferação de células satélite) além de hipertrofia. O análogo LR3 resiste às proteínas ligadoras, aumentando a atividade. Uso off-label; margem de segurança estreita.",
 efeitos:["Hiperplasia muscular (novas fibras) e hipertrofia.","Captação de glicose e aminoácidos; anabolismo local marcante."],
 colaterais:["Hipoglicemia (semelhante à insulina) — risco agudo.","Potencial pró-proliferativo (preocupação oncológica).","Crescimento de órgãos com uso crônico."],
 manejo:["Ter carboidrato disponível (risco de hipoglicemia).","Doses conservadoras; rastreio oncológico; monitorar glicemia."],
 indicacoes:["Síndrome de insensibilidade grave ao GH (deficiência primária de IGF-1) — mecasermina."],
 usos:"Reposição em deficiência de IGF-1; off-label hiperplasia.",
 fisi:"Buscado por hiperplasia; risco de hipoglicemia e evidência humana limitada. Uso avançado e arriscado.",
 monit:"Glicemia, IGF-1, rastreio oncológico."},

{id:"insulina",cat:"gh",nome:"Insulina",sub:"Hormônio anabólico peptídico",chem:"5,8 kDa · 51 aminoácidos (2 cadeias)",pubchem:null,mol3d:"peptide",
 classe:"Hormônio peptídico pancreático (células β) · anabólico e hipoglicemiante",
 pk:"Varia por tipo: rápida (regular ~5-8 h), ultrarrápida (lispro/aspart), NPH (intermediária), glargina/detemir (longa).",
 desc:"Hormônio anabólico central: promove captação de glicose e aminoácidos, síntese de glicogênio e proteínas, e inibe lipólise. Essencial no diabetes. No fisiculturismo é um dos agentes mais perigosos por risco de hipoglicemia fatal.",
 efeitos:["Captação de glicose/aminoácidos no músculo; síntese de glicogênio e proteína.","Volumização celular; potencializa nutrição pós-treino."],
 colaterais:["Hipoglicemia grave (convulsão, coma, morte) — risco agudo e real.","Ganho de gordura se mal manejada; lipo-hipertrofia; retenção.","Uso concomitante com GH agrava resistência insulínica."],
 manejo:["Sempre com carboidratos disponíveis e monitorização glicêmica.","Nunca antes de dormir/sozinho; educação rigorosa.","Erro de dose é potencialmente letal — não indicado para uso não médico."],
 indicacoes:["Diabetes mellitus tipo 1 (essencial) e tipo 2 (quando necessário), cetoacidose, diabetes gestacional, hipercalemia (com glicose)."],
 usos:"Terapia do diabetes; anabolismo (off-label, alto risco).",
 fisi:"Usada no pós-treino/pós-refeição por avançados para volumização e captação de nutrientes; margem de erro mínima e potencialmente fatal.",
 monit:"Glicemia capilar frequente, HbA1c, peso/composição."},

{id:"secretagogos",cat:"gh",nome:"Secretagogos de GH (GHRP / GHRH)",sub:"Ipamorelina · GHRP-6 · CJC-1295 · Hexarelina",chem:"Peptídeos sintéticos curtos",pubchem:null,mol3d:"peptide",
 classe:"Peptídeos liberadores de GH · agonistas de grelina (GHRP) e análogos de GHRH",
 pk:"Curta (minutos a poucas horas); CJC-1295 DAC tem ação prolongada. Estimulam pulso endógeno de GH.",
 desc:"Em vez de repor GH, estimulam a hipófise a liberar GH endógeno de forma pulsátil (mais fisiológico). GHRPs (ipamorelina, GHRP-6) agem via receptor de grelina; GHRH análogos (CJC-1295, sermorelina) somam-se. Frequentemente combinados (ex.: CJC-1295 + Ipamorelina).",
 efeitos:["Aumento pulsátil de GH/IGF-1; melhora de sono, recuperação e lipólise.","Ipamorelina é seletiva (pouco efeito sobre cortisol/prolactina); GHRP-6 aumenta muito o apetite."],
 colaterais:["Retenção hídrica, parestesias, fome (GHRP-6), leve elevação de prolactina/cortisol (peptídeos menos seletivos).","Resistência insulínica em doses altas; qualidade/pureza variável."],
 manejo:["Preferir peptídeos seletivos (ipamorelina); doses fisiológicas; aplicar em jejum/antes de dormir.","Monitorar IGF-1 e glicemia."],
 indicacoes:["Diagnóstico/tratamento de deficiência de GH (sermorelina/tesamorelina); tesamorelina para lipodistrofia do HIV."],
 usos:"Estímulo fisiológico de GH; recuperação, sono, anti-aging (off-label).",
 fisi:"Alternativa 'mais suave' ao GH; usados para recuperação, sono e lipólise gradual.",
 monit:"IGF-1, glicemia, prolactina (peptídeos menos seletivos)."},

{id:"hcg",cat:"pct",nome:"Gonadotrofina Coriônica (HCG)",sub:"Análogo de LH · estímulo testicular",chem:"Glicoproteína ~36 kDa",pubchem:null,mol3d:"peptide",
 classe:"Hormônio glicoproteico · mimético de LH (estimula células de Leydig)",
 pk:"Meia-vida ~24-36 h; aplicação 2-3x/semana em baixas doses para manutenção testicular.",
 desc:"Mimetiza o LH, estimulando as células de Leydig a produzir testosterona intratesticular e manter volume/função testicular. Fundamental para preservar fertilidade durante uso androgênico e na PCT/terapia de fertilidade.",
 efeitos:["Manutenção/recuperação do volume e função testiculares.","Produção de testosterona endógena e espermatogênese; preserva fertilidade."],
 colaterais:["Aromatização aumentada (estradiol↑) → ginecomastia se em excesso.","Dessensibilização das células de Leydig com doses altas contínuas.","Acne, retenção, alterações de humor."],
 manejo:["Doses baixas e intermitentes; associar IA se estradiol subir.","Não usar isoladamente em altas doses por tempo prolongado."],
 indicacoes:["Hipogonadismo hipogonadotrófico, infertilidade masculina, criptorquidia; indução de ovulação e suporte de fase lútea na mulher."],
 usos:"Fertilidade masculina, manutenção testicular em TRT/ciclo, PCT.",
 fisi:"Usada durante ciclos para evitar atrofia testicular e na PCT para reativar o eixo antes dos SERMs.",
 monit:"Testosterona, estradiol, espermograma, volume testicular."},

/* ---------------- TIREOIDE ---------------- */
{id:"t3",cat:"tir",nome:"Liotironina (T3)",sub:"Triiodotironina · hormônio tireoidiano ativo",chem:"C₁₅H₁₂I₃NO₄",pubchem:"liothyronine",
 classe:"Hormônio tireoidiano ativo (T3) · agonista de receptores tireoidianos",
 pk:"Meia-vida ~1 dia; início rápido, ação potente. Requer fracionamento.",
 desc:"Forma metabolicamente ativa do hormônio tireoidiano. Aumenta a taxa metabólica basal e a termogênese. Clinicamente usado em hipotireoidismo (menos que T4) e coma mixedematoso. No fisiculturismo, usado para acelerar perda de gordura — com risco de perda muscular e supressão tireoidiana.",
 efeitos:["Aumento do metabolismo basal e da lipólise; termogênese.","Melhora de energia em hipotireoidismo."],
 colaterais:["Taquicardia, arritmia, tremor, intolerância ao calor, ansiedade.","Catabolismo muscular se sem androgênio/proteína adequados.","Supressão do eixo tireoidiano (recuperação ao desmamar); osteoporose e risco cardíaco crônico."],
 manejo:["Titulação e desmame graduais; nunca suspender abruptamente doses altas.","Associar androgênio protetor de massa; monitorar FC/ritmo."],
 indicacoes:["Hipotireoidismo (especialmente resistente), coma mixedematoso, bócio, teste de supressão tireoidiana."],
 usos:"Reposição tireoidiana; aceleração metabólica (off-label).",
 fisi:"Usado em cutting agressivo/pré-contest pela lipólise; risco de perda muscular — geralmente com EAA e desmame cuidadoso.",
 monit:"TSH, T3/T4 livres, FC/ECG, densidade óssea em uso crônico."},

{id:"t4",cat:"tir",nome:"Levotiroxina (T4)",sub:"Tiroxina · pró-hormônio tireoidiano",chem:"C₁₅H₁₁I₄NO₄",pubchem:"levothyroxine",
 classe:"Hormônio tireoidiano (T4) · convertido perifericamente em T3",
 pk:"Meia-vida ~6-7 dias; níveis estáveis, dose única diária. Padrão-ouro da reposição.",
 desc:"Pró-hormônio convertido em T3 nos tecidos, permitindo reposição fisiológica estável. É o tratamento de escolha do hipotireoidismo. Efeito metabólico mais suave e previsível que o T3.",
 efeitos:["Normalização do metabolismo em hipotireoidismo; energia, humor, peso.","Ação estável e fisiológica (conversão regulada em T3)."],
 colaterais:["Excesso → tireotoxicose (taquicardia, perda de massa, osteoporose, fibrilação atrial).","Interações (cálcio, ferro, IBP reduzem absorção)."],
 manejo:["Titular por TSH; tomar em jejum, longe de cálcio/ferro.","Ajuste lento em cardiopatas/idosos."],
 indicacoes:["Hipotireoidismo (todas as causas), bócio, supressão de TSH em câncer de tireoide, hipotireoidismo congênito/gestacional."],
 usos:"Reposição tireoidiana padrão.",
 fisi:"Menos usado que T3 para 'queima' (ação mais lenta); alguns preferem por ser mais estável/seguro.",
 monit:"TSH (alvo terapêutico), T4 livre, FC."},

/* ---------------- ADJUVANTES / PCT ---------------- */
{id:"tamoxifeno",cat:"pct",nome:"Tamoxifeno (Nolvadex)",sub:"SERM · modulador seletivo do receptor de estrogênio",chem:"C₂₆H₂₉NO",pubchem:"tamoxifen",
 classe:"SERM · antagonista estrogênico na mama, agonista em fígado/osso",
 pk:"Meia-vida ~5-7 dias (metabólito endoxifeno mais longo). Dose oral diária.",
 desc:"Bloqueia o receptor de estrogênio na mama (antagonista) enquanto age como agonista em fígado e osso. Padrão no câncer de mama receptor-positivo. No contexto androgênico, previne/trata ginecomastia e reativa o eixo HPG na PCT (aumenta LH/FSH).",
 efeitos:["Bloqueia ginecomastia (antagonismo mamário).","Aumenta LH/FSH → recuperação de testosterona endógena (PCT).","Efeito protetor ósseo e melhora de perfil lipídico (agonismo hepático)."],
 colaterais:["Risco tromboembólico; ondas de calor, náusea.","Alterações visuais raras; reduz IGF-1; interage com inibidores de aromatase (reduz níveis)."],
 manejo:["Cautela em histórico trombótico; combinar com clomifeno na PCT.","Não combinar com IA sem ajuste (interação)."],
 indicacoes:["Câncer de mama (tratamento e prevenção), ginecomastia, indução de ovulação (off-label), certos casos de infertilidade."],
 usos:"Ginecomastia e PCT (reativação do eixo).",
 fisi:"Pilar da PCT e do controle de ginecomastia durante/depois do ciclo.",
 monit:"Sinais trombóticos, testosterona/LH/FSH, exame mamário."},

{id:"clomifeno",cat:"pct",nome:"Clomifeno (Clomid)",sub:"SERM · estímulo gonadotrófico",chem:"C₂₆H₂₈ClNO",pubchem:"clomifene",
 classe:"SERM · antagonista estrogênico hipotalâmico → ↑ LH/FSH",
 pk:"Meia-vida ~5-7 dias (isômeros com cinéticas distintas). Dose oral diária/cíclica.",
 desc:"Bloqueia receptores de estrogênio no hipotálamo, 'enganando' o eixo para aumentar GnRH → LH/FSH, elevando testosterona (homem) ou induzindo ovulação (mulher). Base da PCT e usado em hipogonadismo secundário para preservar fertilidade.",
 efeitos:["Aumento de LH/FSH e testosterona endógena.","Indução de ovulação na mulher; alternativa à TRT quando se deseja manter fertilidade."],
 colaterais:["Distúrbios visuais (escotomas — suspender), alterações de humor.","Ondas de calor; gestação múltipla (na indução ovulatória); enxaqueca."],
 manejo:["Suspender se sintomas visuais; ajustar dose; monitorar resposta hormonal.","Isômero enclomifeno tende a ter melhor perfil."],
 indicacoes:["Infertilidade anovulatória feminina, hipogonadismo hipogonadotrófico masculino, infertilidade masculina idiopática (off-label)."],
 usos:"PCT, fertilidade, hipogonadismo secundário.",
 fisi:"Núcleo da PCT (frequentemente com tamoxifeno) para reativar produção endógena de testosterona.",
 monit:"Testosterona/LH/FSH, visão, humor, resposta ovulatória (mulher)."},

{id:"anastrozol",cat:"pct",nome:"Anastrozol (Arimidex)",sub:"Inibidor de aromatase (não esteroidal)",chem:"C₁₇H₁₉N₅",pubchem:"anastrozole",
 classe:"Inibidor de aromatase reversível (tipo II) · reduz conversão de andrógeno em estrogênio",
 pk:"Meia-vida ~48 h; dose oral diária/em dias alternados. Reduz estradiol de forma dose-dependente.",
 desc:"Bloqueia a enzima aromatase, reduzindo a produção de estradiol a partir de andrógenos. No câncer de mama pós-menopausa é padrão; no uso androgênico controla estradiol para prevenir ginecomastia e retenção. Excesso de bloqueio derruba estradiol demais (com efeitos adversos próprios).",
 efeitos:["Redução de estradiol → controle de ginecomastia/retenção.","Aumento indireto de testosterona/andrógeno livre."],
 colaterais:["Estradiol muito baixo: artralgia, queda de libido, disfunção erétil, ressecamento, humor deprimido.","Piora de perfil lipídico e densidade óssea (estrogênio é protetor)."],
 manejo:["Titular pela dosagem de estradiol (não 'zerar'); ajuste fino em dias alternados.","Repor estradiol se hipoestrogenismo sintomático."],
 indicacoes:["Câncer de mama pós-menopausa (adjuvante/avançado); ginecomastia; puberdade precoce e baixa estatura (off-label)."],
 usos:"Controle de estradiol em ciclos/TRT; oncologia.",
 fisi:"Usado para prevenir/controlar efeitos estrogênicos de esteroides aromatizáveis; risco de 'crash' de estradiol se exagerado.",
 monit:"Estradiol sérico, densidade óssea, lipídios, libido/humor."},

{id:"letrozol",cat:"pct",nome:"Letrozol (Femara)",sub:"Inibidor de aromatase potente",chem:"C₁₇H₁₁N₅",pubchem:"letrozole",
 classe:"Inibidor de aromatase não esteroidal (tipo II) · mais potente que anastrozol",
 pk:"Meia-vida ~2 dias; supressão estrogênica intensa (>98%).",
 desc:"IA muito potente. Reduz estradiol de forma marcante — útil em ginecomastia estabelecida e câncer de mama, mas fácil de exagerar (hipoestrogenismo severo). Também usado em indução ovulatória (SOP) por elevar FSH.",
 efeitos:["Supressão estrogênica forte; reversão de ginecomastia inicial.","Indução de ovulação (SOP) com bom perfil."],
 colaterais:["Hipoestrogenismo intenso: artralgia severa, libido zerada, humor, lipídios/osso.","'Rebote' de estradiol se suspenso abruptamente."],
 manejo:["Doses baixas e pontuais; desmame gradual; monitorar estradiol.","Reservar para ginecomastia/emergência estrogênica."],
 indicacoes:["Câncer de mama pós-menopausa, indução de ovulação (SOP, off-label), ginecomastia."],
 usos:"Controle estrogênico potente; oncologia; fertilidade.",
 fisi:"Usado para reverter ginecomastia inicial e em ciclos muito aromatizáveis; alto risco de crash de estradiol.",
 monit:"Estradiol, lipídios, densidade óssea, humor."},

{id:"exemestano",cat:"pct",nome:"Exemestano (Aromasin)",sub:"Inibidor de aromatase esteroidal (irreversível)",chem:"C₂₀H₂₄O₂",pubchem:"exemestane",
 classe:"Inibidor de aromatase esteroidal (tipo I, 'suicida') · liga irreversivelmente a enzima",
 pk:"Meia-vida ~24 h; inativa a aromatase de forma permanente (nova enzima precisa ser sintetizada).",
 desc:"IA esteroidal que se liga irreversivelmente à aromatase. Não causa rebote de estradiol ao suspender e tem efeito androgênico leve com melhor perfil ósseo/lipídico que os não esteroidais. Preferido por muitos para controle estrogênico mais estável.",
 efeitos:["Redução de estradiol sem rebote; efeito ósseo/lipídico mais favorável.","Leve efeito androgênico do próprio composto."],
 colaterais:["Hipoestrogenismo se em excesso (artralgia, libido, humor).","Fadiga, sudorese."],
 manejo:["Titular por estradiol; vantagem de não gerar rebote.","Boa opção para uso prolongado/PCT."],
 indicacoes:["Câncer de mama pós-menopausa (adjuvante/avançado); ginecomastia; controle estrogênico."],
 usos:"Controle de estradiol estável; oncologia.",
 fisi:"Preferido por não causar rebote e proteger osso/lipídios; usado em ciclo e PCT.",
 monit:"Estradiol, lipídios, densidade óssea."},

{id:"cabergolina",cat:"pct",nome:"Cabergolina (Dostinex)",sub:"Agonista dopaminérgico · controle de prolactina",chem:"C₂₆H₃₇N₅O₂",pubchem:"cabergoline",
 classe:"Agonista de receptor D2 de dopamina · reduz prolactina",
 pk:"Meia-vida muito longa (~63-69 h); dose 1-2x/semana.",
 desc:"Agonista dopaminérgico que suprime a prolactina. Essencial no manejo de colaterais de 19-nor (nandrolona, trembolona) que elevam prolactina, causando disfunção sexual. Também melhora libido e função erétil por via dopaminérgica.",
 efeitos:["Redução de prolactina → reversão de disfunção erétil/libido induzida por 19-nor.","Melhora de libido e período refratário (dopaminérgico)."],
 colaterais:["Náusea, hipotensão, tontura, cefaleia.","Doses altas crônicas: risco de valvopatia cardíaca (fibrose); alterações de humor/compulsões."],
 manejo:["Doses baixas guiadas por prolactina; ecocardiograma se uso prolongado/alta dose.","Introduzir gradualmente para reduzir náusea."],
 indicacoes:["Hiperprolactinemia, prolactinoma, inibição da lactação, adjuvante na doença de Parkinson."],
 usos:"Controle de prolactina; oncologia hipofisária.",
 fisi:"Usada com nandrolona/trembolona para prevenir/tratar 'deca dick' e disfunção sexual.",
 monit:"Prolactina, PA, ecocardiograma (uso crônico)."},

/* ---------------- ENDÓGENOS ---------------- */
{id:"estradiol",cat:"endo",nome:"Estradiol (E2)",sub:"Principal estrogênio",chem:"C₁₈H₂₄O₂",pubchem:"estradiol",
 classe:"Hormônio esteroide estrogênico endógeno",
 pk:"Varia por via (oral, transdérmico, injetável). Transdérmico evita primeiro passo hepático e reduz risco trombótico.",
 desc:"Principal estrogênio, fundamental em ambos os sexos. Regula ciclo menstrual, densidade óssea, perfil lipídico, função endotelial, libido e cognição. No homem em TRT, o equilíbrio (não a ausência) de estradiol é essencial para libido, ossos e articulações.",
 efeitos:["Saúde óssea, cardiovascular e lipídica; libido e função sexual.","Caracteres sexuais femininos; feminização (terapia de gênero)."],
 colaterais:["Excesso: retenção, ginecomastia (homem), risco trombótico (oral), enxaqueca.","Deficiência: osteoporose, artralgia, disfunção sexual, humor."],
 manejo:["Preferir via transdérmica (menor risco trombótico); titular por níveis e sintomas.","No homem, manter estradiol em faixa fisiológica (não suprimir a zero)."],
 indicacoes:["Terapia de reposição na menopausa, hipogonadismo feminino, falência ovariana, terapia hormonal feminizante, osteoporose, contracepção (combinado)."],
 usos:"Reposição feminina, terapia de gênero, saúde óssea.",
 fisi:"Relevante como parâmetro a controlar (não usar) em homens em ciclo; equilíbrio de E2 evita colaterais e otimiza bem-estar.",

{id:"pregnenolona",cat:"endo",nome:"Pregnenolona",sub:"'Hormônio-mãe' · precursor esteroide",chem:"C₂₁H₃₂O₂",pubchem:"pregnenolone",

{id:"cortisol",cat:"endo",nome:"Cortisol / Glicocorticoides",sub:"Hidrocortisona · prednisona · dexametasona",chem:"C₂₁H₃₀O₅ (cortisol)",pubchem:"hydrocortisone",

 desc:"Hormônio do estresse, regula metabolismo de glicose, resposta inflamatória e pressão. Terapeuticamente é anti-inflamatório/imunossupressor potente. No contexto do fisiculturismo é o principal hormônio catabólico — EAA competem por reduzir sua ação.",
 efeitos:["Anti-inflamatório e imunossupressor potente (terapêutico).","Mobiliza glicose; regula estresse e PA."],
 colaterais:["Catabolismo muscular, ganho de gordura central, resistência insulínica.","Osteoporose, imunossupressão, hipertensão, insônia, alterações de humor.","Supressão adrenal com uso crônico (não suspender abruptamente)."],
 manejo:["Menor dose eficaz pelo menor tempo; desmame gradual; proteção óssea/gástrica.","No fisiculturismo, o objetivo é limitar seu efeito catabólico (recuperação, sono, EAA)."],

 fisi:"Não usado para 'ganho' — é o inimigo catabólico; EAA reduzem seu efeito. Corticoides locais tratam lesões.",

{id:"melatonina",cat:"endo",nome:"Melatonina",sub:"Hormônio do sono/ritmo circadiano",chem:"C₁₃H₁₆N₂O₂",pubchem:"melatonin",

 pk:"Meia-vida curta (~30-60 min); tomada à noite. Formulações de liberação prolongada existem.",
 desc:"Secretada pela pineal no escuro, sincroniza o ritmo circadiano e induz o sono. Antioxidante e imunomoduladora. Relevante para recuperação (sono de qualidade eleva GH endógeno e otimiza reparo muscular).",

 manejo:["Doses baixas (0,5-3 mg) 30-60 min antes de dormir; higiene do sono associada."],

const main = document.getElementById('main');
const listEl = document.getElementById('list');
let current = null, tab = 'lib', viewer = null, subtab = 'ficha', libsub = 'hormonios';

function buildList(filter=""){
  const f = filter.trim().toLowerCase();
  let html = "";
  for(const key in CATS){
    const items = H.filter(h=>h.cat===key && (
      !f || h.nome.toLowerCase().includes(f) || h.sub.toLowerCase().includes(f) ||
      (h.classe||"").toLowerCase().includes(f) || (h.indicacoes||[]).join(" ").toLowerCase().includes(f)
    ));
    if(!items.length) continue;
    html += `<div class="cat" style="--catc:${CATS[key].color}">${CATS[key].label}</div>`;
    for(const h of items){
      const fs = FASE[h.id];
      html += `<button class="hbtn ${current===h.id?'active':''}" data-id="${h.id}" style="--c:${CATS[key].color}">
        <span class="dot"></span>${h.nome}
        ${fs?`<span class="tag" style="background:${faseCor(fs)}1f;color:${faseCor(fs)}">${faseShort(fs)}</span>`:''}
      </button>`;
    }
  }
  listEl.innerHTML = html || `<div style="padding:30px 14px;color:var(--ink-faint);font-size:13px">Nenhum resultado.</div>`;
  listEl.querySelectorAll('.hbtn').forEach(b=>b.onclick=()=>{selectHormone(b.dataset.id);closeMobile();});
}

function selectHormone(id){
  current = id; tab='lib'; subtab='ficha'; libsub='hormonios';
  document.querySelectorAll('.navtab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='lib'));
  const h = H.find(x=>x.id===id);
  const c = CATS[h.cat].color;
  main.innerHTML = renderHormone(h,c);
  buildList(document.getElementById('search').value);
  main.scrollTop = 0;
  init3D(h);
  updateListVis();
}

/* ---- 3D molecule ---- */
let spinning = true, styleMode = 0;
function init3D(h){
  const spin = document.getElementById('vspin');
  const label = document.getElementById('vlabel');
  const el = document.getElementById('viewer');
  if(viewer){try{viewer.clear();}catch(e){}}
  el.innerHTML=""; spin.style.display='grid';

  if(h.mol3d==="peptide" || !h.pubchem){
    // peptídeo/proteína — sem SDF pequeno; ilustração estilizada
    spin.style.display='none';
    label.textContent = "Hormônio peptídico — representação ilustrativa";
    el.innerHTML = peptideArt();
    return;
  }
  const url = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(h.pubchem)}/SDF?record_type=3d`;
  fetchSDF(url).then(sdf=>{
    spin.style.display='none';
    viewer = $3Dmol.createViewer(el,{backgroundColor:'rgb(6,12,26)'});
    viewer.addModel(sdf,'sdf');
    applyStyle();
    viewer.zoomTo(); viewer.zoom(1.15); viewer.render();
    if(spinning) viewer.spin('y',0.6);
    label.textContent = `${h.nome} — 3D interativo (arraste p/ girar)`;
  }).catch(()=>{
    // fallback 2d
    const url2 = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(h.pubchem)}/SDF`;
    fetchSDF(url2).then(sdf=>{
      spin.style.display='none';
      viewer = $3Dmol.createViewer(el,{backgroundColor:'rgb(6,12,26)'});
      viewer.addModel(sdf,'sdf'); applyStyle(); viewer.zoomTo(); viewer.render();
      if(spinning) viewer.spin('y',0.6);
      label.textContent = `${h.nome} — estrutura (2D→3D aproximada)`;
    }).catch(()=>{
      spin.style.display='none';

function calcFreeT(){
  const T=parseFloat(document.getElementById('ft_t').value);
  const S=parseFloat(document.getElementById('ft_s').value);
  let A=parseFloat(document.getElementById('ft_a').value); if(!(A>0))A=4.3;
  const out=document.getElementById('ft_out');
  if(!(T>0)||!(S>0)){out.innerHTML='Informe testosterona total (ng/dL) e SHBG (nmol/L).';return;}
  const Tm=T*0.0347*1e-9, Sm=S*1e-9, Alb=A*10/66500, Ka=3.6e4, Kt=1e9;
  const N=Ka*Alb+1, a=N*Kt, b=N+Kt*(Sm-Tm), c=-Tm;
  const FT=(-b+Math.sqrt(b*b-4*a*c))/(2*a);
  const FTng=FT*2.884e10, pct=FT/Tm*100, Bio=FT*(1+Ka*Alb)*2.884e10;
  out.innerHTML=`Testosterona livre: <b>${FTng.toFixed(2)} ng/dL</b> (${pct.toFixed(2)}%) · Biodisponível: <b>${Bio.toFixed(0)} ng/dL</b>. <span style="color:var(--ink-faint)">Vermeulen · albumina ${A} g/dL.</span>`;
}
function calcHOMA(){
  const g=parseFloat(document.getElementById('h_g').value), i=parseFloat(document.getElementById('h_i').value);
  const out=document.getElementById('h_out');
  if(!(g>0)||!(i>0)){out.innerHTML='Informe glicemia de jejum (mg/dL) e insulina (µUI/mL).';return;}
  const homa=g*i/405; let txt=homa<2.5?'baixa probabilidade de resistência insulínica':(homa<2.9?'limítrofe':'sugere resistência insulínica');
  out.innerHTML=`HOMA-IR: <b>${homa.toFixed(2)}</b> — ${txt}. <span style="color:var(--ink-faint)">Corte varia por população (~2,5–2,9).</span>`;
}
function calcEGFR(){
  const scr=parseFloat(document.getElementById('e_cr').value), age=parseFloat(document.getElementById('e_age').value), sex=document.getElementById('e_sex').value;
  const out=document.getElementById('e_out');
  if(!(scr>0)||!(age>0)){out.innerHTML='Informe creatinina (mg/dL) e idade.';return;}
  const k=sex==='f'?0.7:0.9, al=sex==='f'?-0.241:-0.302;
  let e=142*Math.pow(Math.min(scr/k,1),al)*Math.pow(Math.max(scr/k,1),-1.200)*Math.pow(0.9938,age);
  if(sex==='f')e*=1.012;
  let cat=e>=90?'G1 (normal)':e>=60?'G2 (levemente reduzida)':e>=45?'G3a':e>=30?'G3b':e>=15?'G4':'G5';
  out.innerHTML=`TFG estimada: <b>${e.toFixed(0)} mL/min/1,73m²</b> — ${cat}. <span style="color:var(--ink-faint)">CKD-EPI 2021 (creatinina). Em atletas, prefira cistatina C.</span>`;
}

  const inp=(id,ph,step)=>`<div><label>${ph}</label><input id="${id}" type="number" ${step?`step="${step}"`:''} placeholder="—"></div>`;
  const chk=(id,txt)=>`<label class="chk"><input type="checkbox" id="${id}">${txt}</label>`;
  main.innerHTML = `${disclaimer()}
  <div class="indwrap">
    <div class="indhead">
      <h2>Avaliador Clínico</h2>
      <p>Insira dados, sintomas e exames do paciente. O material aplica <b>critérios de diretriz (simplificados)</b> e indica se há critério de tratamento e qual seria a conduta <b>padrão-ouro</b>, com contraindicações e próximos passos. Ferramenta de apoio — não substitui o julgamento clínico.</p>
    </div>

    <div class="card sec full" style="margin-bottom:16px">
      <h3><span class="ic" style="--icbg:rgba(46,230,200,.14)">👤</span> Dados do paciente</h3>
      <div class="avgrid">
        <div><label>Sexo</label><select id="av_sex"><option value="m">Masculino</option><option value="f">Feminino</option></select></div>
        ${inp('av_age','Idade (anos)')}
        ${inp('av_wt','Peso (kg)','0.1')}
        ${inp('av_ht','Altura (cm)')}
        ${inp('av_waist','Cintura (cm)')}
      </div>
    </div>

    <div class="card sec full" style="margin-bottom:16px">
      <h3><span class="ic" style="--icbg:rgba(155,107,255,.16)">📝</span> Sintomas</h3>
      <div style="font-size:11px;color:var(--ink-faint);margin:2px 0 4px;text-transform:uppercase;letter-spacing:.5px">Sexuais / androgênicos</div>
      <div class="chkgrid">
        ${chk('sy_libido','Queda de libido')}${chk('sy_ed','Disfunção erétil')}${chk('sy_morning','↓ ereções matinais')}${chk('sy_musc','Perda de massa/força')}
      </div>
      <div style="font-size:11px;color:var(--ink-faint);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.5px">Gerais / metabólicos</div>
      <div class="chkgrid">
        ${chk('sy_fad','Fadiga/energia baixa')}${chk('sy_mood','Humor/irritabilidade')}${chk('sy_sleep','Sono ruim')}${chk('sy_gain','Ganho de gordura abdominal')}
      </div>
      <div style="font-size:11px;color:var(--ink-faint);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.5px">Tireoidianos</div>
      <div class="chkgrid">
        ${chk('sy_cold','Intolerância ao frio')}${chk('sy_consti','Constipação')}${chk('sy_dry','Pele seca/queda de cabelo')}${chk('sy_brady','Lentificação/bradipsiquismo')}
      </div>
    </div>

    <div class="card sec full" style="margin-bottom:16px">
      <h3><span class="ic" style="--icbg:rgba(90,209,255,.16)">🧪</span> Exames laboratoriais</h3>
      <div class="avgrid">
        ${inp('av_tt','Testo total (ng/dL)')}${inp('av_ft','Testo livre (pg/mL)','0.1')}${inp('av_shbg','SHBG (nmol/L)','0.1')}
        ${inp('av_lh','LH (UI/L)','0.1')}${inp('av_fsh','FSH (UI/L)','0.1')}${inp('av_e2','Estradiol (pg/mL)','0.1')}
        ${inp('av_prl','Prolactina (ng/mL)','0.1')}${inp('av_psa','PSA (ng/mL)','0.01')}${inp('av_hct','Hematócrito (%)','0.1')}
        ${inp('av_glic','Glicemia jejum (mg/dL)')}${inp('av_a1c','HbA1c (%)','0.1')}${inp('av_tsh','TSH (mUI/L)','0.01')}
        ${inp('av_t4l','T4 livre (ng/dL)','0.01')}${inp('av_igf','IGF-1 (ng/mL)')}
      </div>
    </div>

    <div class="card sec full" style="margin-bottom:16px">
      <h3><span class="ic" style="--icbg:rgba(255,207,107,.16)">⚑</span> Comorbidades &amp; fatores</h3>
      <div class="chkgrid">
        ${chk('cm_htn','Hipertensão')}${chk('cm_dm2','Diabetes tipo 2')}${chk('cm_dlp','Dislipidemia')}${chk('cm_osa','Apneia do sono')}
        ${chk('fx_fert','Deseja fertilidade')}${chk('fx_prost','História Ca próstata/mama')}${chk('fx_cmt','História CMT / NEM-2')}${chk('fx_panc','Pancreatite prévia')}
      </div>
    </div>

    <div class="card sec full" style="margin-bottom:16px">
      <h3><span class="ic" style="--icbg:rgba(75,227,160,.16)">📎</span> Observações / colar exames (opcional)</h3>
      <textarea id="av_notes" placeholder="Cole aqui resultados adicionais ou observações clínicas..." style="width:100%;min-height:80px;padding:10px 12px;border-radius:10px;border:1px solid var(--stroke);background:rgba(6,12,26,.7);color:var(--ink);font-size:13px;outline:none;resize:vertical"></textarea>
      <div style="margin-top:10px"><label style="font-size:11px;color:var(--ink-faint)">Anexar arquivo de texto (.txt/.csv) — PDFs: prefira colar o conteúdo acima</label>
      <input type="file" id="av_file" accept=".txt,.csv,text/plain" onchange="readExamFile(this)" style="display:block;margin-top:6px;color:var(--ink-dim);font-size:12px"></div>
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px">
      <button class="calcbtn" style="font-size:14px;padding:12px 24px" onclick="avaliar()">⚕️ Avaliar critérios de tratamento</button>
      <button class="calcbtn" style="background:linear-gradient(120deg,#9b6bff,#4d8bff)" onclick="gerarPromptAval()">🤖 Gerar prompt para o bot</button>
    </div>

    <div id="av_out"></div>
  </div>`;
  main.scrollTop=0;
}
function readExamFile(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{const t=document.getElementById('av_notes');t.value=(t.value?t.value+"\n":"")+"["+f.name+"]\n"+e.target.result;};
  r.readAsText(f);
}
function _n(id){const v=parseFloat((document.getElementById(id)||{}).value);return isNaN(v)?null:v;}
function _c(id){const el=document.getElementById(id);return !!(el&&el.checked);}
function avVerdict(v){
  const map={ind:['#4be3a0','✅ Critério presente — tratamento indicado'],cons:['#ffcf6b','🟡 Considerar / avaliar individualmente'],
    nao:['#6a7ea6','⚪ Sem critério no momento'],ci:['#ff6b6b','⛔ Contraindicação / alerta'],ins:['#7fb0ff','ℹ️ Dados insuficientes']};
  return map[v]||map.ins;
}
function avaliar(){
  const out=document.getElementById('av_out');
  const sex=(document.getElementById('av_sex')||{}).value||'m';
  const age=_n('av_age'), wt=_n('av_wt'), ht=_n('av_ht');
  const imc = (wt&&ht)? wt/Math.pow(ht/100,2) : null;
  const tt=_n('av_tt'), ft=_n('av_ft'), lh=_n('av_lh'), e2=_n('av_e2'), prl=_n('av_prl'),
        psa=_n('av_psa'), hct=_n('av_hct'), glic=_n('av_glic'), a1c=_n('av_a1c'), tsh=_n('av_tsh'), t4l=_n('av_t4l'), igf=_n('av_igf');
  const symSex=_c('sy_libido')||_c('sy_ed')||_c('sy_morning')||_c('sy_musc');
  const symGen=_c('sy_fad')||_c('sy_mood')||_c('sy_sleep')||_c('sy_gain');
  const symThy=_c('sy_cold')||_c('sy_consti')||_c('sy_dry')||_c('sy_brady');
  const comorb=_c('cm_htn')||_c('cm_dm2')||_c('cm_dlp')||_c('cm_osa');
  const res=[];

  /* --- Hipogonadismo / TRT (homem) --- */
  if(sex==='m'){
    let v,txt,opt=[];
    if(tt===null && (symSex||symGen)){
      v='ins'; txt='Sintomas sugestivos, mas sem testosterona total. <b>Solicitar testosterona total matinal (jejum, antes das 10h), repetida em 2 ocasiões</b>, + SHBG/testosterona livre e LH/FSH.';
    } else if(tt!==null){
      const baixa = tt<300, limitrofe = tt>=300&&tt<400;
      if(baixa && (symSex||symGen)){
        v='ind';
        let cls = (lh!==null)? (lh>9?'primário (LH/FSH elevados)':'secundário (LH/FSH baixo/normal — investigar prolactina, ferro, RM de hipófise)') : 'a classificar (dosar LH/FSH)';
        txt=`Testosterona total <b>${tt} ng/dL</b> (baixa) + sintomas → <b>critérios de hipogonadismo presentes</b>. Confirmar com <b>2ª dosagem matinal</b>. Tipo: ${cls}.`;
        if(_c('fx_fert')){
          txt+=' Como deseja <b>fertilidade</b>, o padrão-ouro é <b>estimular o eixo</b> (clomifeno ± hCG) — evitar testosterona exógena isolada.';
          opt=['clomifeno','hcg'];
        } else {
          txt+=' Padrão-ouro: <b>reposição de testosterona</b> (éster IM enantato/cipionato ou undecanoato; ou gel transdérmico), alvo no <b>meio da faixa normal</b>.';
          opt=['testo-e','testo-c','testo-u'];
        }
        // contraindicações/alertas
        const al=[];
        if(psa!==null&&psa>4) al.push('PSA >4 ng/dL — investigar/urologia antes de iniciar');
        if(_c('fx_prost')) al.push('História de Ca próstata/mama — contraindicação');
        if(hct!==null&&hct>54) al.push('Hematócrito >54% — corrigir/adiar (risco trombótico)');
        if(al.length) txt+=`<div style="margin-top:8px;color:#ff9b8a">⛔ Antes de iniciar: ${al.join('; ')}.</div>`;
      } else if(baixa && !(symSex||symGen)){
        v='cons'; txt=`Testosterona baixa (<b>${tt}</b>) sem sintomas registrados — o diagnóstico exige <b>sintoma + laboratório</b>. Confirmar sintomas e repetir dosagem.`;
      } else if(limitrofe && (symSex||symGen)){
        v='cons'; txt=`Testosterona limítrofe (<b>${tt}</b>) com sintomas — dosar <b>testosterona livre</b> (SHBG) e repetir; considerar tratamento se livre baixa.`;
      } else {
        v='nao'; txt=`Testosterona <b>${tt} ng/dL</b> não baixa — hipogonadismo improvável. Investigar outras causas dos sintomas (tireoide, apneia, depressão, anemia, fármacos).`;
      }
    } else { v=null; }
    if(v) res.push({t:'Hipogonadismo masculino / Reposição de testosterona',v,txt,opt});
  }

  /* --- Obesidade / DM2 → incretínicos --- */
  {
    let v=null,txt='',opt=[];
    const dm2 = _c('cm_dm2') || (a1c!==null&&a1c>=6.5) || (glic!==null&&glic>=126);
    if(imc!==null){
      if(imc>=30){ v='ind'; txt=`IMC <b>${imc.toFixed(1)}</b> (obesidade) → <b>critério para farmacoterapia</b> adjuvante a dieta/exercício.`; }
      else if(imc>=27 && (comorb||dm2)){ v='ind'; txt=`IMC <b>${imc.toFixed(1)}</b> (sobrepeso) + comorbidade → <b>critério para farmacoterapia</b>.`; }
      else { v='nao'; txt=`IMC <b>${imc.toFixed(1)}</b> — sem critério de farmacoterapia para obesidade isolada.`; }
    } else if(dm2){ v='cons'; txt='DM2 identificado (sem IMC) — considerar incretínico.'; }
    if(v==='ind'||v==='cons'){
      txt+=' Padrão-ouro atual em eficácia: <b>tirzepatida</b> (GIP/GLP-1) ou <b>semaglutida 2,4 mg</b>; em DM2, priorizar agente com benefício <b>cardiovascular/renal</b>.';
      opt=['tirzepatida','semaglutida'];
      const al=[];
      if(_c('fx_cmt')) al.push('História de CMT/NEM-2 — contraindicação aos GLP-1');
      if(_c('fx_panc')) al.push('Pancreatite prévia — cautela');
      if(al.length) txt+=`<div style="margin-top:8px;color:#ff9b8a">⛔ ${al.join('; ')}.</div>`;
    }
    if(dm2){ txt+=' <span style="color:var(--ink-faint)">DM2 presente — alvo glicêmico individualizado.</span>'; }
    if(v) res.push({t:'Obesidade / DM2 — agonistas de incretina',v,txt,opt});
  }

  /* --- Tireoide --- */
  if(tsh!==null){
    let v,txt,opt=['t4'];
    if(tsh<0.4){ v='ci'; txt=`TSH <b>${tsh}</b> suprimido — investigar <b>tireotoxicose</b> ou excesso de reposição/T3. Não iniciar hormônio tireoidiano.`; opt=[]; }
    else if(tsh>4.0 && t4l!==null && t4l<0.8){ v='ind'; txt=`TSH <b>${tsh}</b> elevado + T4L baixo → <b>hipotireoidismo franco</b>. Padrão-ouro: <b>levotiroxina</b> (~1,6 mcg/kg/dia, titular por TSH).`; }
    else if(tsh>4.0){ v='cons'; txt=`TSH <b>${tsh}</b> elevado com T4L normal/ausente → <b>hipotireoidismo subclínico</b>. Tratar se TSH>10, anti-TPO+, sintomas ou gestação; senão, monitorar.`; }
    else { v='nao'; txt=`TSH <b>${tsh}</b> normal — sem critério para reposição tireoidiana.`; opt=[]; }
    res.push({t:'Função tireoidiana',v,txt,opt});
  }

  /* --- Prolactina --- */
  if(prl!==null && prl>(sex==='m'?15:25)){
    res.push({t:'Prolactina',v:'cons',opt:['cabergolina'],
      txt:`Prolactina <b>${prl} ng/mL</b> elevada — investigar causas (fármacos, macroprolactina, hipotireoidismo, <b>RM de hipófise</b>). Se prolactinoma sintomático: agonista dopaminérgico (cabergolina).`});
  }

  /* --- Eritrocitose (alerta transversal) --- */
  if(hct!==null && hct>54){
    res.push({t:'Alerta — Eritrocitose',v:'ci',opt:[],
      txt:`Hematócrito <b>${hct}%</b> acima de 54% — <b>risco trombótico</b>. Investigar (androgênios, AOS, tabagismo, desidratação); considerar flebotomia e revisar dose androgênica.`});
  }

  /* --- GH (breve) --- */
  if(igf!==null && igf<100 && (symGen)){
    res.push({t:'Eixo GH/IGF-1',v:'cons',opt:['gh'],
      txt:`IGF-1 <b>${igf}</b> baixo com sintomas — considerar investigação de <b>deficiência de GH no adulto</b> com testes de estímulo antes de qualquer reposição.`});
  }

  if(!res.length){
    out.innerHTML=`<div class="card sec full"><div class="verdict" style="background:#7fb0ff22;color:#7fb0ff">ℹ️ Dados insuficientes</div><p>Preencha ao menos os exames/sintomas relevantes (ex.: testosterona total + sintomas, IMC, TSH) para gerar a avaliação.</p></div>`;
    return;
  }
  out.innerHTML = `<div class="card sec full" style="margin-bottom:14px">
      <h3><span class="ic" style="--icbg:rgba(46,230,200,.14)">📋</span> Resultado da avaliação${imc!==null?` · IMC ${imc.toFixed(1)} kg/m²`:''}</h3>
      <p style="font-size:12px;color:var(--ink-faint)">Critérios simplificados de diretriz — confirmar dosagens (ex.: 2 medidas matinais de testosterona) e individualizar. Não substitui julgamento clínico.</p>
    </div>` +
    res.map(r=>{const vc=avVerdict(r.v);return `<div class="card sec full avcard" style="margin-bottom:14px;border-color:${vc[0]}44">
      <h4>${r.t}</h4>
      <div class="verdict" style="background:${vc[0]}22;color:${vc[0]}">${vc[1]}</div>
      <p style="line-height:1.65">${r.txt}</p>
      ${r.opt&&r.opt.length?`<div style="margin-top:10px"><span style="font-size:11px;color:var(--ink-faint)">Padrão-ouro / opções — abrir ficha:</span><br>${r.opt.map(id=>{const h=H.find(x=>x.id===id);return h?`<span class="avopt" onclick="goItem('${id}')">${h.nome}</span>`:'';}).join('')}</div>`:''}
    </div>`;}).join("");
  out.scrollIntoView({behavior:'smooth',block:'start'});
}
function gerarPromptAval(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
  const sym=[['sy_libido','↓libido'],['sy_ed','disfunção erétil'],['sy_morning','↓ereções matinais'],['sy_musc','perda de massa'],['sy_fad','fadiga'],['sy_mood','humor'],['sy_sleep','sono ruim'],['sy_gain','gordura abdominal'],['sy_cold','intolerância ao frio'],['sy_consti','constipação'],['sy_dry','pele seca'],['sy_brady','bradipsiquismo']].filter(s=>_c(s[0])).map(s=>s[1]);
  const fat=[['cm_htn','HAS'],['cm_dm2','DM2'],['cm_dlp','dislipidemia'],['cm_osa','AOS'],['fx_fert','deseja fertilidade'],['fx_prost','hx Ca próstata/mama'],['fx_cmt','hx CMT/NEM2'],['fx_panc','pancreatite prévia']].filter(s=>_c(s[0])).map(s=>s[1]);
  const ex=[['av_tt','Testo total'],['av_ft','Testo livre'],['av_shbg','SHBG'],['av_lh','LH'],['av_fsh','FSH'],['av_e2','E2'],['av_prl','Prolactina'],['av_psa','PSA'],['av_hct','Hematócrito'],['av_glic','Glicemia'],['av_a1c','HbA1c'],['av_tsh','TSH'],['av_t4l','T4L'],['av_igf','IGF-1']].filter(e=>g(e[0])).map(e=>`${e[1]}=${g(e[0])}`);
  const p=`Você é o HormoneLab. Avalie este paciente e diga: (1) há critérios de tratamento hormonal? (2) qual a conduta PADRÃO-OURO por diretriz atual? (3) contraindicações e exames que faltam? (4) monitorização.\n\nPACIENTE: sexo ${g('av_sex')==='f'?'feminino':'masculino'}, ${g('av_age')||'?'} anos, peso ${g('av_wt')||'?'} kg, altura ${g('av_ht')||'?'} cm, cintura ${g('av_waist')||'?'} cm.\nSINTOMAS: ${sym.join(', ')||'—'}.\nFATORES/COMORBIDADES: ${fat.join(', ')||'—'}.\nEXAMES: ${ex.join('; ')||'—'}.\nOBSERVAÇÕES: ${g('av_notes')||'—'}.\n\nResponda de forma estruturada, citando os valores de corte e as fontes/diretrizes.`;
  const out=document.getElementById('av_out');
  out.innerHTML=`<div class="card sec full">
    <h3><span class="ic" style="--icbg:rgba(155,107,255,.16)">🤖</span> Prompt para o bot HormoneLab</h3>
    <p style="font-size:12px;color:var(--ink-faint);margin-bottom:8px">Copie e cole no bot para uma análise aprofundada com busca de diretrizes.</p>
    <textarea readonly style="width:100%;min-height:220px;padding:12px;border-radius:10px;border:1px solid var(--stroke);background:rgba(6,12,26,.7);color:var(--ink);font-size:12.5px;line-height:1.5;resize:vertical">${p.replace(/</g,'&lt;')}</textarea>
    <button class="calcbtn" style="margin-top:10px" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.previousElementSibling.value);this.textContent='✔ Copiado'">Copiar prompt</button>
  </div>`;
  out.scrollIntoView({behavior:'smooth',block:'start'});
}

function montarPlano(){
  const out=document.getElementById('pl_out');
  const obj=(document.getElementById('pl_obj')||{}).value||'emagrecer';
  const sex=(document.getElementById('pl_sex')||{}).value||'m';
  const af=parseFloat((document.getElementById('pl_act')||{}).value||'1.55');
  const exp=(document.getElementById('pl_exp')||{}).value||'int';
  const age=_n('pl_age'), wt=_n('pl_wt'), ht=_n('pl_ht'), meta=_n('pl_meta'), dias=_n('pl_dias');
  const comorb=_c('pl_htn')||_c('pl_dm2')||_c('pl_card')||_c('pl_hep');
  if(!(wt>0)||!(ht>0)||!(age>0)){out.innerHTML=`<div class="card sec full"><div class="verdict" style="background:#7fb0ff22;color:#7fb0ff">ℹ️ Dados insuficientes</div><p>Preencha ao menos peso, altura e idade.</p></div>`;return;}
  const bmr = 10*wt + 6.25*ht - 5*age + (sex==='f'?-161:5);
  const tdee = Math.round(bmr*af);
  const imc = wt/Math.pow(ht/100,2);

  // avaliação de realismo
  let verdict='cons', vtxt='', natPlan='', projLine='';
  const A = ACEL[obj]||ACEL.emagrecer;

  if(obj==='emagrecer'){
    const reqDef = (meta>0&&dias>0)? Math.round(meta*7700/dias) : null;
    const weekly = (meta>0&&dias>0)? meta/(dias/7) : null;
    const pct = weekly? weekly/wt*100 : null;
    const natDef = Math.round(tdee*0.22);
    const natWeekly = natDef/1100; // kg/semana aprox
    const projNat = dias? natWeekly*(dias/7) : null;

function getNat(id){return NATURAIS.find(n=>n.id===id);}
function getSupp(id){return NATURAIS.find(x=>x.id===id)||VITAMINAS.find(x=>x.id===id)||ENZIMAS.find(x=>x.id===id);}
function bioCard(o){return `<div class="biocard"><div class="bh"><span class="bi">${o.ic||'•'}</span><span class="bn">${o.nome}</span>${o.tag?`<span class="cphase" style="background:${o.tagc}22;color:${o.tagc}">${o.tag}</span>`:''}</div>${o.rows.map(r=>(r&&r.v)?`<div class="bl"><b style="color:${r.c||'var(--ink)'}">${r.k}:</b> ${r.v}</div>`:'').join('')}</div>`;}
function bioSection(l,c,ic,cards){return `<div class="card sec full" style="margin-bottom:16px"><h3><span class="ic" style="--icbg:${c}22">${ic}</span> ${l} <span style="font-size:12px;color:var(--ink-faint);font-weight:400">· ${cards.length}</span></h3><div class="biogrid">${cards.join('')}</div></div>`;}

function renderNaturais(){
  const opts=Object.keys(BLENDS).map(k=>`<option value="${k}">${BLENDS[k].nome}</option>`).join("");
  const flours=NATURAIS.filter(n=>n.grp==='farinha');
  const fchk=flours.map(n=>`<label class="chk"><input type="checkbox" class="blendchk" value="${n.id}">${n.nome.replace('Farinha de ','').replace(/\\(.*\\)/,'').trim()}</label>`).join("");
  let secs="";
  for(const g in NAT_GRP){
    const cards=NATURAIS.filter(n=>n.grp===g).map(n=>bioCard({nome:n.nome,ic:n.ic,tag:n.evid,tagc:evidCor(n.evid),rows:[
      {k:"Benefício",v:n.benef,c:"#4be3a0"},{k:"Cuidados",v:n.efeitos,c:"#ff9b8a"},{k:"Uso",v:n.dose},{k:"+ Tirzepatida",v:n.tirze,c:"#7fd0ff"}]}));
    secs+=bioSection(NAT_GRP[g].l,NAT_GRP[g].c,NAT_GRP[g].ic,cards);
  }
  main.innerHTML=`${disclaimer()}${libSubBar()}
  <div class="indwrap">

function gerarProtocolo(){

  const blocks=sel.map(c=>{

    if(kind==='h'){hasH=true;const h=H.find(x=>x.id===id);if(!h)return'';if(h.cat==='glp1')hasGLP=true;

      return `<div class="labitem"><div class="en">🌿 ${o.nome}${o.evid?` <span class="cphase" style="background:${evidCor(o.evid)}22;color:${evidCor(o.evid)}">${o.evid}</span>`:''}</div>

function pqBuildQuery(){
  const q=pqVal('pq_q'), P=pqVal('pq_p'), I=pqVal('pq_i'), C=pqVal('pq_c'), O=pqVal('pq_o');
  let base=[I,C,O,P].filter(Boolean).join(' ');
  if(!base) base=q;
  const tipo=PQ_TIPO[pqVal('pq_tipo')||'qualquer']||'';
  const full=(base+(tipo?(' AND ('+tipo+')'):'')).trim();
  return {q,P,I,C,O,base,tipo,full};
}
function pqLibMatches(){
  const parts=[pqVal('pq_q'),pqVal('pq_p'),pqVal('pq_i'),pqVal('pq_c'),pqVal('pq_o')].join(' ');
  const toks=pqTokens(parts); if(!toks.length) return {horm:[],supp:[]};
  const horm=H.map(h=>{const s=pqHas([h.nome,h.id,(h.efeitos||[]).join(' '),(h.colaterais||[]).join(' '),CATS[h.cat]?CATS[h.cat].label:''].join(' '),toks);return{h,s};})
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,6).map(x=>x.h);
  const allSupp=[...NATURAIS,...VITAMINAS,...ENZIMAS];
  const supp=allSupp.map(o=>{const s=pqHas([o.nome,o.id,o.benef||o.funcao||'',o.efeitos||o.cuidados||''].join(' '),toks);return{o,s};})
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8).map(x=>x.o);
  return {horm,supp};
}

    <div style="font-size:12px;color:var(--ink-faint);margin-top:4px"><b>Uso:</b> ${o.dose||'—'}${o.tirze?` · <b>+Tirze:</b> ${o.tirze}`:''}</div></div>`).join('');
  const goal=pqVal('pq_goal');
  return `<div class="card sec full" style="margin-top:16px">
    <h3><span class="ic" style="--icbg:rgba(46,230,200,.14)">🧩</span> Protocolo a partir dos achados${goal?` — ${GOAL_LABEL[goal]}`:''}</h3>
    <p style="font-size:12px;color:var(--ink-faint);margin-bottom:8px">Candidatos da sua biblioteca relevantes ao tema. Refine na aba <b>Protocolos</b> (com comparação Hormonal × Natural × Não fazer nada).</p>
    ${hb?`<div class="cat" style="--catc:#4d8bff;margin:6px 0">💉 Hormônios / agentes</div>${hb}`:''}
    ${sb?`<div class="cat" style="--catc:#4be3a0;margin:10px 0 6px">🌿 Naturais / vitaminas / enzimas</div>${sb}`:''}
    <div class="disc" style="margin-top:12px"><span>⚠️</span><div>Seleção automática por palavras-chave — validar pertinência clínica. Individualizar dose e monitorização. Uso estético de anabolizantes é vedado no Brasil (Lei 9.965/2000).</div></div>
  </div>`;
}
function pqAIPrompt(Q,m){
  const ctx=[...m.horm.map(h=>h.nome),...m.supp.map(o=>o.nome)].join(', ')||'—';
  const tipoLabel=(document.querySelector('#pq_tipo option:checked')||{}).textContent||'Qualquer';
  const goal=pqVal('pq_goal');
  return `Você é o HormoneLab, assistente clínico do Dr. Tenner. Faça uma PESQUISA baseada em evidência e organize os melhores achados, depois monte um protocolo.

PERGUNTA: ${Q.q||'—'}
PICO — População: ${Q.P||'—'} | Intervenção: ${Q.I||'—'} | Comparador: ${Q.C||'—'} | Desfecho: ${Q.O||'—'}
Tipo de evidência priorizado: ${tipoLabel}
${goal?`Objetivo do protocolo: ${GOAL_LABEL[goal]}`:''}
Itens relevantes já na base HormoneLab: ${ctx}

TAREFAS:
1) Pesquise (PubMed, ClinicalTrials.gov, Cochrane, diretrizes, ANVISA/FDA/EMA) e traga os MELHORES achados atuais, priorizando maior nível de evidência. Para cada achado: fonte, ano, desenho, n, resultado principal e limitação.
2) Organize em: (a) o que está bem estabelecido; (b) o que é promissor/em estudo (com fase); (c) o que é controverso ou sem suporte.
3) Situação regulatória (Brasil/ANVISA — incluindo RDC 973/2025 e Portaria 344/98 quando pertinente; e FDA/EMA).
4) Monte um PROTOCOLO baseado nos achados, comparando a rota hormonal (se indicada) × natural × não fazer nada, com benefícios, colaterais, doses/esquema, e MONITORIZAÇÃO laboratorial.
5) Cite as referências ao final.

Enquadramento: informação técnica para profissional de saúde; não é prescrição; muitos usos são off-label; uso estético de anabolizantes é vedado no Brasil (Lei 9.965/2000); nunca instruções de síntese ou de burla antidoping.`;
}
function organizarPesquisa(){

  const enc=encodeURIComponent(Q.full);
  const srcBtns=PQ_SRC.map(s=>`<a href="${s.u(enc)}" target="_blank" rel="noopener" class="labitem" style="display:block;text-decoration:none;border-left:3px solid ${s.c}">
      <div class="en" style="color:${s.c}">${s.n} ↗</div>
      <div style="font-size:12px;color:var(--ink-dim)">${s.d}</div></a>`).join('');
  const m=pqLibMatches();
  const chips=arr=>arr.length?arr.join(''):'<span style="color:var(--ink-faint);font-size:12px">nenhum item correspondente na base</span>';
  const hormChips=m.horm.map(h=>`<span class="avopt" onclick="goItem('${h.id}')">${h.nome}</span>`).join('');
  const suppChips=m.supp.map(o=>`<span class="avopt" style="cursor:default">${o.nome}</span>`).join('');
  const prompt=pqAIPrompt(Q,m);
  out.innerHTML=`
  <div class="card sec full" style="margin-bottom:16px">
    <h3><span class="ic" style="--icbg:rgba(77,139,255,.16)">🗺️</span> Plano de pesquisa</h3>

    </div>
    <div style="margin-top:12px"><label style="font-size:12px;color:var(--ink-faint)">Estratégia de busca sugerida</label>
      <textarea readonly style="width:100%;min-height:52px;padding:10px;border-radius:9px;border:1px solid var(--stroke);background:rgba(6,12,26,.7);color:var(--ink);font-size:12.5px;resize:vertical">${Q.full.replace(/</g,'&lt;')}</textarea></div>
  </div>

  <div class="card sec full" style="margin-bottom:16px">
    <h3><span class="ic" style="--icbg:rgba(46,230,200,.14)">📚</span> Melhores fontes — abrir busca (nova janela)</h3>
    <div class="grid2" style="margin-top:8px">${srcBtns}</div>
  </div>

  <div class="card sec full" style="margin-bottom:16px">
    <h3><span class="ic" style="--icbg:rgba(155,107,255,.16)">🔗</span> Achados na biblioteca HormoneLab</h3>
    <div style="margin-top:6px"><b style="font-size:12px;color:var(--ink-dim)">💉 Hormônios / agentes (abrir ficha):</b><br>${chips([hormChips])}</div>
    <div style="margin-top:10px"><b style="font-size:12px;color:var(--ink-dim)">🌿 Naturais / vitaminas / enzimas:</b><br>${chips([suppChips])}</div>
  </div>

  ${pqProtoScaffold(m)}

  <div class="card sec full" style="margin-top:16px">
    <h3><span class="ic" style="--icbg:rgba(155,107,255,.16)">🤖</span> Prompt pronto para a IA (bot HormoneLab)</h3>
    <p style="font-size:12px;color:var(--ink-faint);margin-bottom:8px">Copie e cole no bot para a síntese com busca ao vivo — ou use o painel "IA ao vivo" abaixo.</p>
    <textarea readonly style="width:100%;min-height:230px;padding:12px;border-radius:10px;border:1px solid var(--stroke);background:rgba(6,12,26,.7);color:var(--ink);font-size:12.5px;line-height:1.5;resize:vertical">${prompt.replace(/</g,'&lt;')}</textarea>
    <button class="calcbtn" style="margin-top:10px" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.previousElementSibling.value);this.textContent='✔ Copiado'">Copiar prompt</button>
  </div>`;
  window._pqPrompt=prompt;
  out.scrollIntoView({behavior:'smooth',block:'start'});
}

async function pesquisaIAlive(){
  const box=document.getElementById('pq_ia_out');
  const key=pqVal('pq_key'), model=pqVal('pq_model')||'claude-sonnet-4-5';
  if(!key){box.innerHTML=`<div class="disc"><span>🔑</span><div>Cole uma chave de API para usar o modo ao vivo, ou use o botão "Organizar pesquisa" (não precisa de chave).</div></div>`;return;}
  const Q=pqBuildQuery();
  if(!Q.full){box.innerHTML=`<div class="disc"><span>⚠️</span><div>Descreva o tema primeiro.</div></div>`;return;}
  const prompt=window._pqPrompt||pqAIPrompt(Q,pqLibMatches());
  box.innerHTML=`<div class="labitem"><div class="en">⏳ Pesquisando com IA…</div><div style="font-size:12px;color:var(--ink-dim)">Pode levar de 20s a 1min se a busca na web estiver ativa.</div></div>`;
  const body={model,max_tokens:4096,messages:[{role:'user',content:prompt}]};
  if(document.getElementById('pq_web')&&document.getElementById('pq_web').checked){
    body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:6}];
  }
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
    const data=await resp.json();
    if(!resp.ok){
      const msg=(data&&data.error&&data.error.message)||('HTTP '+resp.status);
      box.innerHTML=`<div class="disc"><span>❌</span><div><b>Falha na API:</b> ${String(msg).replace(/</g,'&lt;')}<br><span style="font-size:12px">Verifique a chave e o nome do modelo (campo "Modelo"). Se o erro citar a ferramenta de busca, desmarque "Usar busca na web".</span></div></div>`;
      return;
    }
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n\n').trim()||'(sem texto na resposta)';
    const esc=txt.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    box.innerHTML=`<div class="card sec full" style="border-color:rgba(155,107,255,.35)">
      <h3><span class="ic" style="--icbg:rgba(155,107,255,.16)">✅</span> Resultado da IA</h3>
      <div style="white-space:pre-wrap;line-height:1.6;font-size:13px;color:var(--ink)">${esc}</div>
      <button class="calcbtn" style="margin-top:12px" onclick="navigator.clipboard&&navigator.clipboard.writeText(${JSON.stringify(txt)});this.textContent='✔ Copiado'">Copiar resultado</button>
    </div>`;
    box.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){
    box.innerHTML=`<div class="disc"><span>❌</span><div><b>Erro de rede/CORS:</b> ${String(e.message||e).replace(/</g,'&lt;')}<br><span style="font-size:12px">Alguns navegadores bloqueiam chamadas diretas em arquivos locais. Nesse caso, use o prompt pronto no bot HormoneLab.</span></div></div>`;
  }
}
